name: Publicar versão

# Ao enviar uma tag vX.Y.Z (ex.: git tag v0.9.4 && git push origin v0.9.4) cria a Release com o ZIP
# que o atualizador da app descarrega. Faz o mesmo que o build/publish.ps1 -Release, mas sem precisar do gh no PC.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testes
        run: dotnet test tests/PCOptimizer.Tests -c Release

      - name: Compilar a app
        shell: pwsh
        run: |
          $app = "publish/PC Optimizer"
          dotnet publish src/PCOptimizer.App -c Release -r win-x64 --self-contained true -o $app
          if ($LASTEXITCODE -ne 0) { throw 'O publish falhou.' }
          $full = (Resolve-Path $app).Path
          Get-ChildItem $app -Recurse -File -Exclude *.pdb | ForEach-Object { $_.FullName.Substring($full.Length + 1) } | Set-Content "$app/files.txt" -Encoding utf8
          Get-ChildItem $app -Recurse -Filter *.pdb | Remove-Item

      # Assinatura pela SignPath Foundation: fica desligada até a SignPath aprovar o projeto.
      # Para ligar: segredo SIGNPATH_API_TOKEN e variáveis SIGNPATH_ORGANIZATION_ID e SIGNPATH_ENABLED=true no repositório.
      - name: Enviar para assinar
        id: unsigned
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rigwise-unsigned
          path: publish/PC Optimizer

      - name: Assinar (SignPath)
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rigwise
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/signed

      - name: Usar os ficheiros assinados
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          # sem assinatura não se publica: se a pasta não veio, o passo falha
          if (-not (Test-Path publish/signed/PCOptimizer.exe)) { throw 'A SignPath não devolveu a app assinada.' }
          Copy-Item publish/signed/* "publish/PC Optimizer" -Recurse -Force

      - name: ZIP da app
        shell: pwsh
        run: |
          $app = "publish/PC Optimizer"
          Compress-Archive -Path $app -DestinationPath publish/PCOptimizer-win-x64.zip
          # a versão da app tem de ser a da tag: senão o atualizador anunciava uma versão e instalava outra
          $version = (Get-Item "$app/PCOptimizer.exe").VersionInfo.ProductVersion -replace '\+.*$', ''
          if ("v$version" -ne "${{ github.ref_name }}") { throw "A tag ${{ github.ref_name }} não bate com a versão da app ($version)." }
          $log = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($version))\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          [IO.File]::WriteAllText("publish/notas.md", $(if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Rigwise $version" }))
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/PCOptimizer-win-x64.zip --title "Rigwise $env:VERSION" --notes-file publish/notas.md
